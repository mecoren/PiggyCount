pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    // share_plus 12.x requires newer Android build tooling.
    // 9.1.0（2026-10-06 批次B）：Flutter 3.47.6 的兼容矩阵已不含 AGP 8.x ——
    // `flutter analyze --suggestions` 对 8.13.2 直接报 Incompatible AGP/KGP versions，
    // 构建期 apply Flutter Gradle Plugin 失败（Flutter 3.47.6 新建工程模板即 9.1.0）。
    // AGP 9 默认只读新 DSL，这里靠 gradle.properties 里 Flutter migrator 自动加的
    // `android.newDsl=false` 继续读旧 DSL，app/build.gradle 因此无需迁移。
    // 历史：8.13.2 是为 compileSdk 37 的 `platforms/android-37.0` 命名而升的
    // （AGP 8.12.x 只找 `android-37`，报 Failed to find target with hash string）。
    id "com.android.application" version "9.1.0" apply false
    // 2.4.0（2026-10-06 批次B）：与 AGP 9.1.0 配套（Flutter 3.47.6 模板即 2.4.0）；
    // 实测 2.2.20 仍被判 Incompatible AGP/KGP versions。Kotlin 2.2.0 在 Flutter 3.44
    // 时只是"即将放弃"警告，3.47.6 起变成硬失败。
    id "org.jetbrains.kotlin.android" version "2.4.0" apply false
}

include ":app"
