allprojects {
    repositories {
        // 国内镜像：必须放在 google()/mavenCentral() 之前以加速依赖解析
        // 解决问题：integration_test 用动态版本 androidx.test:runner:1.2+，
        // 某些三方插件声明的 jitpack.io 在国内 DNS 不可达 → 构建中断。
        // 阿里云 public 镜像已聚合 google/mavenCentral/jcenter，可解析 androidx 依赖。
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        google()
        mavenCentral()
    }
    // 移除子项目/插件声明的 jitpack.io 仓库（国内不可达，且无需它即可解析 androidx.test）
    // 用 removeIf 避免迭代时修改集合抛 ConcurrentModificationException
    repositories.removeIf { repo ->
        repo.url != null && repo.url.toString().contains('jitpack.io')
    }
}

// Gradle 9 移除了 Project.buildDir（报 "Could not set unknown property 'buildDir'"），
// 改用 layout.buildDirectory；写法对齐 Flutter 3.47.6 官方模板的 newBuildDir。
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    project.layout.buildDirectory.value(newBuildDir.dir(project.name))
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
