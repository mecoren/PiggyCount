org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# `android.enableJetifier` 已移除（2026-10-06）：Jetifier 的作用是把旧 support
# library 依赖重写成 AndroidX，本项目全依赖已 AndroidX（AGP 9 + compileSdk 37），
# 留着只会拖慢每一次构建。若将来引入仍依赖 support library 的库，构建期会报
# 缺失类，届时再把它加回来。
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# AGP 9 起 resValues 这个 build feature 默认关闭（AGP 8 默认开启），而
# app/build.gradle 的 buildTypes / productFlavors 里用了 resValue "string","app_name",...
# 不显式打开会报 "Build Type debug contains custom resource values, but the feature is disabled"。
# 键名来自 AGP 的 BooleanOption.BUILD_FEATURE_RESVALUES
# （从 gradle-9.0.1.jar 的 com/android/build/gradle/options/BooleanOption.class 中确认）。
android.defaults.buildfeatures.resvalues=true
