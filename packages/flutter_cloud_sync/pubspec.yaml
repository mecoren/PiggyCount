name: flutter_cloud_sync
description: A modular cloud sync framework for Flutter with pluggable backend providers
version: 0.1.0
publish_to: none
homepage: https://github.com/mecoren/PiggyCount
repository: https://github.com/mecoren/PiggyCount/tree/main/packages/flutter_cloud_sync

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  device_info_plus: ^11.1.0
  package_info_plus: ^8.1.2
  http: ^1.2.2
  meta: ^1.9.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  web_socket_channel: ^3.0.1
  # L3 循环依赖解除：core 不再依赖任何 provider 包（supabase/webdav/
  # icloud/s3）。此前 core 内的 createCloudServices 工厂反向依赖全部
  # provider，而 provider 又依赖 core 形成循环；工厂已迁至 app 层
  # （lib/cloud/provider_factory.dart），core 回归「接口 + PiggyCount
  # Cloud 协议实现」的纯底层定位。

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.0
  build_runner: ^2.4.0

flutter:
  # This package is a pure Dart package
