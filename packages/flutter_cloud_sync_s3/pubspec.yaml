name: flutter_cloud_sync_s3
description: S3 provider for flutter_cloud_sync - AWS S3, Cloudflare R2, MinIO, and more
version: 0.1.0
publish_to: none
homepage: https://github.com/mecoren/PiggyCount
repository: https://github.com/mecoren/PiggyCount/tree/main/packages/flutter_cloud_sync_s3

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 核心包
  flutter_cloud_sync:
    path: ../flutter_cloud_sync

  # HTTP 客户端
  http: ^1.1.0

  # 加密库（用于签名）
  crypto: ^3.0.3

  # 编码转换（hex编码）
  convert: ^3.1.1

  # XML 解析
  # 停 6.x（2026-10-06 实测驳回 7.x）：xml 7 本身可用（本包只做只读解析 + local-name
  # 匹配，不受其 namespace breaking 影响），但它要求 Dart ^3.11.0，且**与根工程的
  # `excel ^4.0.6` 冲突** —— excel 约束 `xml >=5.0.0 <7.0.0`，而根工程同时 path 依赖
  # 本包，于是根的版本求解直接失败：
  #   "flutter_cloud_sync_s3 from path depends on xml ^7.1.0 and excel >=2.0.1
  #    depends on xml >=5.0.0 <7.0.0 → version solving failed"
  # 等 excel 放开上界（或根工程改用别的 xlsx 方案）后再升。
  xml: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
