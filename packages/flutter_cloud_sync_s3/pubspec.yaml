name: flutter_cloud_sync_s3
description: S3 provider for flutter_cloud_sync - AWS S3, Cloudflare R2, MinIO, and more
version: 0.1.0
publish_to: none
homepage: https://github.com/mecoren/PiggyCount
repository: https://github.com/mecoren/PiggyCount/tree/main/packages/flutter_cloud_sync_s3

environment:
  # xml 7.x 要求 Dart ^3.11.0，故把声明下界一并抬高（根工程为 Dart 3.13.5）
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 核心包
  flutter_cloud_sync:
    path: ../flutter_cloud_sync

  # HTTP 客户端
  http: ^1.1.0

  # 加密库（用于签名）
  crypto: ^3.0.3

  # 编码转换（hex编码）
  convert: ^3.1.1

  # XML 解析
  # 7.x（2026-10-06）：其 BREAKING 集中在 namespace（解析期解析、低层 API 默认
  # 不再解析 namespace、XmlName 变不可变、插入节点改为移动而非抛异常）。本包
  # 只做**只读解析**且一律用 local-name 匹配（findAllLocal / findChildLocal 走
  # child.name.local），既不构造 DOM 也不用 XmlBuilder，故不受影响。
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
