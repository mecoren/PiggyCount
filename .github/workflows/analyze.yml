name: CI

# 本 workflow 是项目的 CI 质量门。工作流名原为 `Analyze`，但自 2026-09-27 起
# 它同时承担 flutter test（同步契约回归门禁），名称已与职责不符，故更名 `CI`。
# 包含两个**并行** job：
#   * analyze —— flutter analyze --fatal-infos（0 issue 门禁）
#   * test    —— flutter test（全量单测 + 同步契约结构性测试）
# 注：更名只动 workflow 的 name，job 名（即分支保护里的 required status check
# 上下文）保持不变。

# 静态分析质量门 —— 2026-09-18 起基线为 **0 条**（0 error / 0 warning / 0 info）。
#
# 历史：2026-09-17 的全面优化评估报告测得 566 条（250 warning / 316 info），
# 其中 unnecessary_non_null_assertion 207、avoid_print 154、
# deprecated_member_use 50、unused_* 25 等。经「dart fix 批量修 + 人工复核
# 死代码/弃用 API」一轮治理后清零。因此这里不再需要「允许存量」的基线文件，
# 直接用 `--fatal-infos` 把任何新增问题（含 info 级）挡在门外。
#
# 如果将来确需临时放宽，把 `--fatal-infos` 换成 `--no-fatal-infos`
# 并在 PR 说明里写清原因与归还计划，不要静默改成非阻断。
#
# 注意：Flutter 版本由 pubspec.yaml 的 `environment.flutter` 单一提供
# （当前 3.44.3），这里用 flutter-version-file 读取，避免与 pubspec.lock 的
# `sdks.flutter` 约束（>=3.44.0）漂移——历史上 release.yml 曾停留 3.27.3，
# 会让 runner 上的 `flutter pub get` 直接解析失败。
# 升版本请只改 pubspec.yaml 一处。

# 触发契约（与 release.yml 的 `v*` tag 发版配套）：
#   * push wait      —— 日常开发主线，每次推送自动跑门禁。
#   * PR → wait      —— 合并前的守门。
# main 分支不再触发：它只作为 PR 目标/归档线存在，避免同一份改动被跑两遍。
# 放开其它分支触发前请确认 runner 额度与「wait 即唯一集成分支」的约定。
on:
  push:
    branches: [wait]
  pull_request:
    branches: [wait]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: flutter analyze (0-issue gate)
    # 钉 24.04 而非 ubuntu-latest：ubuntu-latest 将于 2026-10-19 迁到 Ubuntu 26，
    # 被动跟随会让 Flutter/分析器行为漂移（orbit 同样采用钉版本策略）。
    runs-on: ubuntu-24.04
    # 未设超时时 Actions 默认给 360 分钟，挂死会白烧额度。
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 本地镜像守卫（2026-10-02 新增）。
      # 开发机若设了 PUB_HOSTED_URL（如 pub.flutter-io.cn），`flutter pub get`
      # 会把 pubspec.lock 里 200+ 行 `url` 全量改写成镜像地址，并可能顺带抬几个
      # patch 版本（实测：254 行 url + 4 处版本漂移）。这与业务无关，却会让 CI
      # 侧解析出不一致的 host，故在 Checkout 之后、pub get 之前直接拦死。
      - name: pubspec.lock 镜像守卫（本地镜像地址不得入库）
        run: |
          if grep -nE 'flutter-io\.cn' pubspec.lock; then
            echo "::error::pubspec.lock 含本地镜像地址（本地 PUB_HOSTED_URL 所致），请 git checkout -- pubspec.lock 后重新提交"
            exit 1
          fi
          echo "OK：pubspec.lock 未含本地镜像地址"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: flutter analyze (fail on any issue, including info)
        run: flutter analyze --fatal-infos

      # 无障碍对比度门禁（2026-10-05 新增）：纯 Python 算式，零依赖。
      # 守 WCAG 1.4.3（正文 ≥4.5:1）与 1.4.11（非文本 ≥3:1）；不合格组合
      # 退出码非 0。算式自检：`python3 scripts/contrast_check.py --self-check`。
      - name: 无障碍对比度门禁（contrast_check.py）
        run: python3 scripts/contrast_check.py

  test:
    name: flutter test (同步一致性守门测试)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        # 与 analyze job 同一份版本来源（pubspec.yaml），避免两处漂移
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: "stable"
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # 2026-09-27 起本 job 承担「同步契约」回归门禁。它守的是**结构性**问题，
      # 不是几个孤立用例：
      #   * test/cloud/sync_contract_coverage_test.dart
      #       —— 指纹白名单 ↔ _compareTx 覆盖字段的**穷举**一致性检查。
      #          白名单键由 sync_fingerprint.dart 源码派生，每个键都必须能被
      #          computeDiff 判成 modified（豁免需写明可复核理由）。历史上
      #          「指纹有、diff 没有」已出现两次（审计 S11 附件、D-1 分类、
      #          P1-2 周期锚点），全靠人肉比对才发现；本测试让它无处可藏。
      #   * test/cloud/sync_diff_category_and_zero_amount_test.dart  —— D-1/D-2
      #   * test/cloud/restore_preserves_local_only_columns_test.dart —— P1-5
      # 这三个文件若变红，通常意味着「某字段进了指纹却没进 diff」或
      # 「检测到了却应用不下去」——请勿直接改测试来通过。
      #
      # `--file-reporter expanded:<file>`（2026-10-07 新增）：控制台保持默认 reporter，
      # 同时把**逐用例明细**落盘，供下一步在失败时提取「失败用例名」写成注解。
      # 动机：`flutter test` 的失败明细只存在于作业日志里，而作业日志接口需要仓库
      # admin 权限 ⇒ 外部排查者（含 AI 助手）拿不到「到底哪个用例红了」，只能干等
      # 有人贴日志。注解是匿名可读的（`GET /repos/{o}/{r}/check-runs/{id}/annotations`）。
      # ⚠️ **不要**改成 `flutter test | tee log`：管道背压会把计时敏感用例推过超时，
      # 2026-09-19 实测一次全量跑出 8 例 `did not complete` 假失败。用 file-reporter。
      - name: flutter test
        run: flutter test --file-reporter expanded:ci_test.log

      # 失败用例明细（2026-10-07 新增）。只在失败时跑，成功路径零开销。
      # 1) 把每条失败用例写成 `::error::` 注解 —— 免登录即可从 API / 网页 Annotations 读到；
      # 2) 把失败段落（`[E]` 行 + 紧随其后的 Expected/Actual 上下文）贴进 Job Summary，
      #    让「哪个用例红了、红在哪一行」在两处都能直接看到。
      - name: 失败用例明细（写注解 + Job Summary）
        if: failure()
        run: |
          log=ci_test.log
          if [ ! -f "$log" ]; then
            echo "::warning::未生成 $log（测试可能在建库/解析阶段就失败）"
            exit 0
          fi
          # expanded reporter 的失败行形如：
          #   00:13 +41 -1: /path/to/foo_test.dart: 用例名 [E]
          grep -aE '^[0-9]{2}:[0-9]{2} \+[0-9]+ -[0-9]+: .*\[E\]$' "$log" \
            | tail -20 > fails_raw.txt || true
          if [ ! -s fails_raw.txt ]; then
            echo "::warning::未从 $log 解析出失败用例行，请查看完整作业日志"
          else
            # 注解里的 '%' 必须转义成 %25，否则会被 GitHub 截断。
            sed 's/%/%25/g' fails_raw.txt | while IFS= read -r line; do
              echo "::error title=失败用例::$line"
            done
          fi
          {
            echo '### flutter test 失败明细'
            echo ''
            echo '**失败用例**'
            echo '```'
            if [ -s fails_raw.txt ]; then cat fails_raw.txt; else echo '(未解析到 [E] 行)'; fi
            echo '```'
            echo '**失败上下文**（首个 `[E]` 行及其后续明细）'
            echo '```'
            awk '/^[0-9][0-9]:[0-9][0-9] /{keep=0} /\[E\]$/{keep=1} keep' "$log" \
              | head -60
            echo '```'
            echo '**日志末尾 15 行**'
            echo '```'
            tail -15 "$log"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
