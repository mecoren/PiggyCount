<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Piggy bank icon, clean lines, transparent background -->
  <!-- Body: rounded ellipse with pig features -->

  <!-- Ears (left and right) -->
  <path d="M70 96 L60 60 L100 84 Z" fill="#FFB300" stroke="#000" stroke-width="6" stroke-linejoin="round"/>
  <path d="M186 96 L196 60 L156 84 Z" fill="#FFB300" stroke="#000" stroke-width="6" stroke-linejoin="round"/>

  <!-- Main body: rounded piggy bank shape -->
  <ellipse cx="128" cy="148" rx="80" ry="62" fill="#FFC107" stroke="#000" stroke-width="8"/>

  <!-- Coin slot on top -->
  <rect x="108" y="84" width="40" height="6" rx="3" fill="#000"/>

  <!-- Snout (pig nose) -->
  <ellipse cx="128" cy="158" rx="28" ry="20" fill="#FFB300" stroke="#000" stroke-width="6"/>
  <ellipse cx="120" cy="158" rx="4" ry="6" fill="#000"/>
  <ellipse cx="136" cy="158" rx="4" ry="6" fill="#000"/>

  <!-- Eyes -->
  <circle cx="108" cy="128" r="5" fill="#000"/>
  <circle cx="148" cy="128" r="5" fill="#000"/>

  <!-- Legs (small rounded rectangles) -->
  <rect x="78" y="200" width="18" height="22" rx="6" fill="#FFB300" stroke="#000" stroke-width="6"/>
  <rect x="160" y="200" width="18" height="22" rx="6" fill="#FFB300" stroke="#000" stroke-width="6"/>

  <!-- Tail (curly) -->
  <path d="M208 148 Q220 140 214 128 Q208 120 218 116" stroke="#000" stroke-width="6" stroke-linecap="round" fill="none"/>
</svg>
