name: piggycount
description: "PiggyCount - A simple personal ledger app."
publish_to: 'none'
version: 0.1.2

environment:
  sdk: ^3.6.0
  # Flutter 版本「单一来源」——CI 用 flutter-version-file: pubspec.yaml 读这一行，
  # 与本地 `flutter --version` 对齐。以后升版本只改这里一处。
  #
  # 不要在 .github/workflows/*.yml 里再写 FLUTTER_VERSION：历史上 release.yml
  # 停留在 3.27.3，而 pubspec.lock 已要求 >=3.44.0，两者漂移会让下一次打 tag
  # 发版直接失败。
  flutter: 3.47.6

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # @immutable 注解（encryption_settings 等）显式声明，消除
  # depend_on_referenced_packages（经 flutter SDK 传递可用，lint 要求直声明）
  meta: ^1.16.0
  # 3.4.3（2026-10-06 批次E）：2.x → 3.x 的破坏性变更主要靠官方 legacy 入口
  # 平滑过渡（StateProvider / StateNotifierProvider 已移入
  # package:flutter_riverpod/legacy.dart），其余为 Ref 泛型化等签名调整。
  flutter_riverpod: ^3.4.3
  collection: ^1.18.0
  drift: ^2.35.1
  # ⚠️ 已移除 `sqlite3_flutter_libs`（2026-10-06）—— 前提变了：
  # 它过去的作用是"Android 上唯一真正进 APK 的 SQLite native 库"（0.5.x 打上游
  # libsqlite3.so）。自 Android 启用 SQLCipher 后，运行时改为
  # `dlopen('libsqlcipher.so')`（由 android/app/src/main/jniLibs/ 提供，见下方 hooks
  # 段落），`libsqlite3.so` 已无人加载 —— 留着只会让 APK 每个 ABI 白多 ~1.5MB。
  # 历史坑（不要再走一遍）：0.6.0+eol 会把这个包的代码整体删光（CHANGELOG 原文
  # “removes all code from this package”），而 sqlite3 3.x hooks 的 native 资产在
  # Android 打包环节**不会**被复制进产物，所以"升到 eol 版 + 让 hooks 接管"这条路
  # 走不通（`.dart_tool/flutter_build/<hash>/native_assets.json` 里写了
  # ["system","libsqlite3.so"]，但 APK 的 lib/<abi>/ 下一个 SQLite 库都没有）。
  # 想回退 SQLCipher 时，要把本行连同下方 hooks 的 name_android/name_windows 一起恢复。
  # 直声明：DatabaseHealthService 用只读连接跑 PRAGMA quick_check 探测损坏
  # （drift 未暴露「先校验再迁移」的钩子）。此前仅经 drift 传递可用，属隐式
  # 依赖，lint(depend_on_referenced_packages) 要求直声明。
  sqlite3: ^3.5.1
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.20.2
  decimal: ^3.0.0
  fl_chart: ^1.2.0
  shared_preferences: ^2.3.2
  # 停 7.3.1（2026-10-06 实测）：7.3.2 起依赖 nm ^0.6.0 → dbus ^0.8.0，而
  # flutter_local_notifications 22.x 的 Linux 实现（flutter_local_notifications_linux
  # 8.0.1）仍依赖 dbus ^0.7.8，两版 dbus 无法共存。7.3.2 相对 7.3.1 只是 Linux 侧
  # 的 nm 探测改进，对本项目（Android/iOS）无实际影响。
  # 批次E 补充：`flutter pub outdated` 会把 7.3.2 报成 Resolvable，但实际执行
  # `flutter pub upgrade connectivity_plus` 仍因上述 dbus 冲突失败——该列只做单包
  # 可行性估计，不作准。官方给的出路是升 flutter_local_notifications ^23.0.0-dev.3
  # （预发布版），本项目不采用。
  connectivity_plus: ^7.3.1
  csv: ^8.0.0
  # 批次8：12.x 之前锁 win32 ^5.9，与 share_plus 13 / package_info_plus 10 /
  # flutter_secure_storage 11 的 win32 ^6 互斥；13.x 才改用 win32 ^6。
  file_picker: ^13.1.0
  supabase_flutter: ^2.5.6
  crypto: ^3.0.5
  uuid: ^4.5.1
  flutter_svg: ^2.0.10+1
  # 批次8：10.x 才改用 win32 ^6，与 share_plus 13 / flutter_secure_storage 11
  # 同批升（9.x 锁 win32 ^5，会把 share_plus 13 挡在门外）。
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.0
  in_app_review: ^2.0.9
  http: ^1.2.2
  # 批次8：13.x 要求 win32 ^6.0.1，与 flutter_secure_storage 10/11 同批才解
  # （见下方 flutter_secure_storage 注释）。
  share_plus: ^13.3.1
  # 批次7：13.x 的 BREAKING 是 permission_handler_android 14.x 要求 compileSdk 37，
  # 故本批同步把 android/app/build.gradle 的 compileSdk 抬到 37（CI 需能装
  # Android SDK Platform 37；本机已有 android-37.1 + build-tools 37.0.0）。
  permission_handler: ^13.0.2
  dio: ^5.4.3+1
  open_filex: ^4.4.0
  # 通知链必须同批升：18.x 约束 timezone <0.11.0，22.x 才是 ^0.11.0；
  # 22.x 同时要求 Dart ^3.10.0 / Flutter >=3.38.1（本工具链 3.12.2 / 3.44.3 满足），
  # 且 Android 侧必须开 coreLibraryDesugaring（见 android/app/build.gradle）。
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_list_view: ^1.1.29
  visibility_detector: ^0.4.0+2
  reorderable_grid_view: ^2.2.8
  excel: ^4.0.6
  # 注:0.9.3 要求 Dart >=3.10.0 / Flutter >=3.38.1,在当前工具链
  # (Flutter 3.44.3 / Dart 3.12.2)下已满足,故 ^0.9.2 实际解析到 0.9.3。
  # 0.9.3 相对 0.9.2+1 的实质变化是 iOS UIScene Lifecycle 支持,
  # 与 iOS 侧生命周期整改方向一致,保留即可。
  home_widget: ^0.10.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  # 批次10：12.x 与 image_cropper_platform_interface 8.x 配套，
  # 同时移除下方钉了 7.1.0 的 override（详见 dependency_overrides 注释）。
  image_cropper: ^12.2.1
  gbk_codec: ^0.4.0
  app_links: ^7.2.1
  record: ^7.1.1
  yaml: ^3.1.2
  qr_flutter: ^4.1.0
  gal: ^2.3.0
  # 停 3.x（2026-10-06 实测）：archive 4.x 与 excel ^4.0.6（其依赖 archive ^3.6.1）
  # 互斥，excel 已是最新版无解；只能等 excel 侧放开，或改走别的 xlsx 方案。
  archive: ^3.6.1
  flutter_ai_kit:
    path: packages/flutter_ai_kit
  flutter_ai_kit_zhipu:
    path: packages/flutter_ai_kit_zhipu
  flutter_ai_kit_openai:
    path: packages/flutter_ai_kit_openai
  flutter_cloud_sync:
    path: packages/flutter_cloud_sync
  flutter_cloud_sync_supabase:
    path: packages/flutter_cloud_sync_supabase
  flutter_cloud_sync_webdav:
    path: packages/flutter_cloud_sync_webdav
  flutter_cloud_sync_icloud:
    path: packages/flutter_cloud_sync_icloud
  flutter_cloud_sync_s3:
    path: packages/flutter_cloud_sync_s3
  # v52：行情（投资持仓）核心接口包。当前只有 ManualQuoteProvider（手填净值），
  # 后期接 A股/美股/加密 行情源时新增 flutter_market_data_<vendor> 子包即可，
  # 无需改 schema / 快照格式 / 同步契约（持仓表已预留行情字段与本地缓存列）。
  flutter_market_data:
    path: packages/flutter_market_data
  quick_actions: ^1.1.0
  table_calendar: ^3.1.0
  local_auth: ^3.0.2
  webview_flutter: ^4.13.0
  webview_flutter_wkwebview: ^3.23.0
  country_flags: ^4.1.2
  jovial_svg: ^1.1.29
  # E2EE 同步加密: AES-256-GCM + Argon2id (pure Dart, 全平台)
  cryptography: ^2.7.0
  # 密钥安全存储: iOS Keychain / Android Keystore
  # 批次8：10.x 起 macOS 侧拆为 flutter_secure_storage_darwin，Windows 实现改用
  # win32 ^6（share_plus 13.x 同样要求 win32 ^6，两者必须同批升）；
  # 子包 packages/flutter_cloud_sync 的约束已同步。
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.10
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4
  # Testing framework enhancements
  mocktail: ^1.0.4
  # 测试中 mock getApplicationDocumentsDirectory(附件二进制同步测试)
  path_provider_platform_interface: ^2.1.0
  # file_picker 12+ 的 PlatformFile 是 abstract base class 且不再导出 XFile，
  # test/services/file_reader_memory_test.dart 需要自建 Fake 时显式声明
  # 停 0.3.5（2026-10-07 实测）：`share_plus ^13.3.1` 依赖 `cross_file ^0.3.5+2`，
  # 不含 0.4.0，故升不上去；等 share_plus 放开上界。
  cross_file: ^0.3.5

# dependency_overrides（2026-10-06 批次A 重新启用，当前只钉一项）：
#   - `jni_flutter: 1.0.3`：1.0.4 已被 pub 撤回（retracted），但
#     `path_provider_android 2.3.1` 的约束 `^1.0.1` 仍会把 1.0.4 选为最高版——
#     实测删 lock 重新解析也依然选到 1.0.4（镜像源的版本列表不带 retracted 标记，
#     pub 不会自动避开）。1.0.3 是当前可用最新版且满足上游约束。
#     等 path_provider_android 换掉该依赖后可移除本条。
#
# 两条历史 pin 的去向（均已移除）：
#   - `record_platform_interface: 1.2.0`：随 record 7.1.1 移除——record 7 的官方
#     平台实现统一要求 ^2.1.0，继续钉 1.2.0 会编译通过但运行时接口不匹配。
#   - `image_cropper_platform_interface: 7.1.0`：随 image_cropper 12.2.1 移除——
#     12.x 与 platform_interface 8.x 配套，钉 7.1.0 反而与主包 API 不匹配。
# 裁剪流程需真机回归确认。
dependency_overrides:
  jni_flutter: 1.0.3

# sqlite3 3.x 通过 Dart hooks 提供多套 native 构建：默认 `sqlite3`，另有
# `sqlite3mc`（SQLite3MultipleCiphers）与 `sqlcipher`（整库加密用）。
#
# ⚠️ 2026-10-05 实测：`source: sqlcipher` **在 Windows 单测里生效**（hook 会从
# GitHub release 取 `sqlcipher.dll`，实测 SQLCipher 语义全部通过），但在
# **Android 上不生效**：
#   1. hook 确实解析到了 sqlcipher —— 构建期清单
#      `.dart_tool/flutter_build/<hash>/native_assets.json` 写着
#      `"android_x64": {"package:sqlite3/src/ffi/libsqlite3.g.dart":["absolute","libsqlcipher.so"]}`；
#   2. 但 **APK 里没有 libsqlcipher.so**。保留 `sqlite3_flutter_libs` 时只有它打的
#      上游 `lib/x86_64/libsqlite3.so`（二进制内无 `sqlcipher`/`cipher_export`
#      字样）；把该插件移除后，APK 的 `lib/x86_64/` 干脆一个 SQLite 库都不剩。
#   → 即"hook 的 native 资产没被复制进 Android 产物"。Android 上因此仍跑普通
#   SQLite，`PRAGMA key` 会被当未知 pragma **静默忽略**。
#
# ⚠️ 结论：**整库加密暂时不能在 Android 生效**，所以这里保持 `source: system`
# （= 与加密前逐字一致的行为），加密代码与测试留在仓库里、由运行时能力探测
# （`test/support/sqlcipher_support.dart` 的 `PRAGMA cipher_version`）决定是否启用。
# 要让 Android 也用上 SQLCipher，需要走「自带 native 库 + `source: system`
# `name: sqlcipher`」（见 `prd/sqlcipher_db_encryption/design.md` §2/§7），
# 那是独立一段工作。
#
# 老约束仍然成立：`source: system` 是为了避免构建期去 GitHub 下预编译件
# （部分国内网络会失败）。改用它之外的值前，请先在**真机/模拟器**上确认
# `native_assets.json` 里的资产真的进了 APK。
hooks:
  user_defines:
    sqlite3:
      source: system
      # ── Android 已启用 SQLCipher（2026-10-06）──
      # 库来源：`python scripts/fetch_sqlcipher_android_libs.py --mirror https://ghfast.top/`
      #   → 按 sqlite3 包内 asset_hashes.dart 的 sha256 校验后，落到
      #     android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64}/libsqlcipher.so
      #   → **三个 ABI 的 .so 已入库**（~16.45MB，即 design.md §7 的"入库"分支）：
      #     实测 GitHub release 会 302 到 objects.githubusercontent.com，国内直连超时
      #     （WinError 10060），构建期拉取会失败，故入库换取"clone 即可构建"。
      # 本行让 `source: system` 的 hook 改用该库（hook 支持 `name_$targetOS`，
      # 见 sqlite3 包 lib/src/hook/compile/description.dart:44-49）：
      name_android: sqlcipher
      # Windows 同理，让本地单测也跑在 SQLCipher 上（否则 test/support 的能力探测
      # 探不到 cipher_version，会把加密相关用例整体 skip 掉）。
      # 需自备 `sqlcipher.dll` 并确保它在 PATH 上 —— 与 sqlite3.dll 同一个目录即可
      # （本机放在 `D:\DevTools\sqlite3-bin\`）。取自同一 release 的
      # `sqlcipher.x64.windows.dll`（2026-10-06 实测可用、sha256 校验通过）。
      # 该 dll 属本机工具链、不入库；CI 跑的是 linux，此项不生效。
      name_windows: sqlcipher
      # 护栏：test/data/sqlcipher_android_packaging_contract_test.dart —— 开了本行
      # 却缺任一 ABI 的库时会直接失败（那种状态下应用连 SQLite 都加载不了、起不来）。
      # 历史实测（2026-10-05，Android 15 x86_64 模拟器）：APK 内出现
      # lib/x86_64/libsqlcipher.so（含 cipher_export），运行态日志
      # `SQLite 引擎: SQLCipher 4.18.0 community (SQLite 3.53.4)`；加密后文件头
      # 非明文、持钥可读、关闭后回到明文。

# adaptive_* 三个素材由 scripts/gen_icons_from_image.py 生成(从用户提供的源图抠图);
# monochrome 是 Android 13+ themed icon(Pixel 动态图标)的单色镂空层,见 issue #186。
flutter_launcher_icons:
  android: true
  ios: false  # iOS 图标手工维护,0.14.x 会重写 Contents.json 格式,不要让它碰
  # 透明背景 legacy 图标(按用户要求);部分老 launcher 可能显示黑底,但视觉一致性优先。
  image_path: assets/icon/launcher_legacy.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/adaptive_foreground.png
  adaptive_icon_monochrome: assets/icon/adaptive_monochrome.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/logo.svg
    - assets/piggy.svg
    - assets/logo2.png
    - assets/logo_216.png
    - assets/logo_512.png
    - assets/icon/icon_master.png
    - assets/icons/
    - assets/icons/social/
    - assets/images/
    - assets/header_skins/
  # 字体已移动到可选依赖，使用系统字体以减少应用体积
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
  #   - family: NotoSansSC
  #     fonts:
  #       - asset: assets/fonts/NotoSansSC-Regular.ttf
  #       - asset: assets/fonts/NotoSansSC-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/NotoSansSC-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/NotoSansSC-Bold.ttf
  #         weight: 700
